name: Build and install CI

on:
  push:
    branches: [ master, 'llm/**' ]
  pull_request:
    branches: [ master ]

jobs:
  cxx-build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: "Boost"
      run: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          sudo apt-get update
          sudo apt-get install -y libboost-all-dev
        else
          brew install boost
        fi
    - name: "Configure and make (C++)"
      run: |
        make -C src all

  java-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: "Make one class-file"
      run: |
        echo "Making one class-file"
        make -C Java src/ImageMaker/GenerateImages.class
    - name: "Make jarfiles"
      run: |
        echo "Running java jarfiles"
        make -C Java jarfiles
        :

  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    needs: [java-build, cxx-build]
    steps:
    - uses: actions/checkout@v4
    - name: "Install Boost"
      run: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          sudo apt-get update
          sudo apt-get install -y libboost-all-dev
        else
          brew install boost
        fi
    - name: make
      run: make
    - name: make install
      run: make install
