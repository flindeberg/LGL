name: Testrun CI

on:
  push:
    branches: [ master, 'llm/**' ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    # Linux (x86, scalar pair kernel) and macOS on Apple Silicon (NEON kernel)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: "Install dependencies"
      run: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          sudo apt-get update
          sudo apt-get install -y libboost-all-dev zsh xz-utils
        else
          brew install boost wget
        fi
    - name: "Install everything"
      run: |
        echo Running install
        make install
    - name: "Run a simple graph"
      run: |
        cd scripts
        echo Trying to create graph
        ./creategraphfromdate.sh 2000 09
    - name: Upload graph image
      uses: actions/upload-artifact@v4
      with:
        name: graph-${{ matrix.os }}
        path: testrun/bview_2000_09/bview_2000_09_transparent.png
        if-no-files-found: error
